<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#a1a1aa"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </radialGradient>
    <clipPath id="front">
      <rect x="0" y="32" width="64" height="32"/>
    </clipPath>
  </defs>

  <!-- фон -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- звёзды -->
  <g fill="#fff">
    <circle cx="11" cy="12" r="1.3"/>
    <circle cx="52" cy="10" r="1"/>
    <circle cx="55" cy="26" r="0.8" opacity=".7"/>
    <circle cx="9" cy="46" r="0.9" opacity=".7"/>
    <circle cx="47" cy="54" r="1.2"/>
    <circle cx="24" cy="8" r="0.7" opacity=".6"/>
    <path d="M50 38 l1.2 2.8 2.8 1.2 -2.8 1.2 -1.2 2.8 -1.2 -2.8 -2.8 -1.2 2.8 -1.2z" opacity=".9"/>
  </g>

  <!-- кольцо (задняя часть) -->
  <ellipse cx="32" cy="33" rx="25" ry="8" fill="none" stroke="#71717a" stroke-width="2.4"
           transform="rotate(-22 32 33)"/>

  <!-- планета -->
  <circle cx="32" cy="32" r="13" fill="url(#planet)"/>

  <!-- кольцо (передняя часть) -->
  <ellipse cx="32" cy="33" rx="25" ry="8" fill="none" stroke="#fff" stroke-width="2.4"
           transform="rotate(-22 32 33)" clip-path="url(#front)"/>

  <!-- спутник -->
  <circle cx="53" cy="24" r="2.4" fill="#fff"/>
</svg>
